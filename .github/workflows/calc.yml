# Calc service (apps/calc): the Node supervisor with real headless PoB
# workers on Linux and natively on Windows (no WSL, no Python). Runs the
# package tests with PoB required, the golden builds through the pool, a PoB
# install under a path with umlauts and spaces, and the measurements.
# Details: apps/calc/README.md
name: Calc service

on:
  pull_request:
    paths:
      - "apps/calc/**"
      - "config/calc/**"
      - "config/calc-profiles/**"
      - "packages/contracts/**"
      - "evals/golden/**"
      - "tools/setup_pob.sh"
      - ".github/workflows/calc.yml"
  push:
    branches: [main]
    paths:
      - "apps/calc/**"
      - "config/calc/**"
      - "config/calc-profiles/**"
      - "packages/contracts/**"
      - "evals/golden/**"
      - "tools/setup_pob.sh"
      - ".github/workflows/calc.yml"
  workflow_dispatch:

concurrency:
  group: calc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calc:
    name: Calc pool (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up headless PoB (Linux)
        if: runner.os == 'Linux'
        run: tools/setup_pob.sh

      - name: Fetch pinned PoB and LuaJIT sources (Windows)
        if: runner.os == 'Windows'
        run: |
          pob_ref=$(sed -n 's/^POB_REF="\${POB_REF:-\([0-9a-f]*\)}".*/\1/p' tools/setup_pob.sh)
          lj_ref=$(sed -n 's/^LUAJIT_REF="\([0-9a-f]*\)".*/\1/p' tools/setup_pob.sh)
          echo "PoB $pob_ref / LuaJIT $lj_ref"
          fetch() { git init -q "$3"; git -C "$3" remote add origin "$1"; git -C "$3" fetch -q --depth 1 origin "$2"; git -C "$3" checkout -q FETCH_HEAD; }
          fetch https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git "$pob_ref" .pob/PathOfBuilding-PoE2
          fetch https://github.com/LuaJIT/LuaJIT.git "$lj_ref" .pob/luajit-src

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build luajit.exe next to PoB's lua51.dll (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cd .pob\luajit-src\src
          call msvcbuild.bat
          copy /Y luajit.exe ..\..\PathOfBuilding-PoE2\runtime\luajit.exe

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@astrolabe/calc...

      - name: Tests (PoB required)
        env:
          ASTROLABE_REQUIRE_POB: "1"
        run: pnpm --filter @astrolabe/calc test

      - name: Golden builds through the calc pool
        run: node apps/calc/dist/cli.js golden

      - name: PoB under a path with umlauts and spaces
        run: |
          target="$RUNNER_TEMP/Jörg Ü test/pob"
          mkdir -p "$(dirname "$target")"
          cp -r .pob "$target"
          node apps/calc/dist/cli.js stats evals/golden/builds/pr2-synthetic-fixture.xml --pob-home "$target"

      - name: Measurements
        run: |
          node apps/calc/dist/cli.js bench --workers 1 --rounds 5
          node apps/calc/dist/cli.js bench --workers 2 --rounds 5
