# Windows installer of the desktop app (apps/desktop, ADR-0004).
# - Pull requests that touch the app: build the unsigned installer and attach it
#   as an artifact, so it can be tried on a real Windows PC.
# - "Run workflow" with publish=true: build and publish a GitHub release
#   (Astrolabe-Setup-<version>.exe + latest.yml) that installed apps update from.
# The installer bundles a data release built from PoB in the first job.
name: Desktop installer

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/server/**"
      - "apps/calc/**"
      - "config/calc/**"
      - "config/calc-profiles/**"
      - "config/optimizer/**"
      - "apps/mcp-bridge/**"
      - "config/desktop/**"
      - "config/forge/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      data-release-tag:
        description: "Tag of the data release to bundle, e.g. data-poe2-0.5.5.10-r15 (empty: the newest published one)"
        required: false
        default: ""
      publish:
        description: "Publish a GitHub release (version from apps/desktop/package.json)"
        type: boolean
        default: false

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: Data release for the installer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATA_RELEASE_TAG: ${{ inputs.data-release-tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The installer bundles a published data release (data-release.yml, real game data) instead
      # of building a snapshot of its own, so the bundled game data is the one the pipeline made.
      - name: Download and check the data release
        run: |
          set -euo pipefail
          tag="$DATA_RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep '^data-poe2-' | sort -V | tail -n1)
          fi
          test -n "$tag" || { echo "no data release found" >&2; exit 1; }
          echo "Bundled data release: $tag"
          mkdir -p dl data-snapshots/current/catalog
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'catalog-*.tar.gz*' --dir dl
          (cd dl && sha256sum -c ./*.sha256)
          tar xzf dl/catalog-*.tar.gz -C data-snapshots/current/catalog
          test -f data-snapshots/current/catalog/manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: data-release
          path: data-snapshots/current/catalog/
          retention-days: 7
          if-no-files-found: error

  installer:
    name: Windows installer
    needs: catalog
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: data-release
          path: apps/desktop/data-release
      - name: Fetch the pinned PoB and LuaJIT sources
        shell: bash
        run: |
          pob_ref=$(sed -n 's/^POB_REF="\${POB_REF:-\([0-9a-f]*\)}".*/\1/p' tools/setup_pob.sh)
          lj_ref=$(sed -n 's/^LUAJIT_REF="\([0-9a-f]*\)".*/\1/p' tools/setup_pob.sh)
          echo "PoB $pob_ref / LuaJIT $lj_ref"
          test -n "$pob_ref" && test -n "$lj_ref"
          fetch() { git init -q "$3"; git -C "$3" remote add origin "$1"; git -C "$3" fetch -q --depth 1 origin "$2"; git -C "$3" checkout -q FETCH_HEAD; }
          fetch https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git "$pob_ref" .pob/PathOfBuilding-PoE2
          fetch https://github.com/LuaJIT/LuaJIT.git "$lj_ref" .pob/luajit-src
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build luajit.exe next to PoB's lua51.dll (MSVC, UCRT like PoB's DLLs)
        shell: cmd
        run: |
          cd .pob\luajit-src\src
          call msvcbuild.bat
          copy /Y luajit.exe ..\..\PathOfBuilding-PoE2\runtime\luajit.exe
      - run: pnpm build
      - run: pnpm --filter @astrolabe/mcp-bridge pack:mcpb
      - name: Check the packaged files
        run: node apps/desktop/scripts/stage.mjs
      - name: Build installer
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: Astrolabe-Setup
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
          retention-days: 14
          if-no-files-found: error

  publish:
    # Only from main and by hand: installed apps update themselves from this release.
    name: Publish release
    needs: installer
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: data-release
          path: apps/desktop/data-release
      - name: Fetch the pinned PoB and LuaJIT sources
        shell: bash
        run: |
          pob_ref=$(sed -n 's/^POB_REF="\${POB_REF:-\([0-9a-f]*\)}".*/\1/p' tools/setup_pob.sh)
          lj_ref=$(sed -n 's/^LUAJIT_REF="\([0-9a-f]*\)".*/\1/p' tools/setup_pob.sh)
          echo "PoB $pob_ref / LuaJIT $lj_ref"
          test -n "$pob_ref" && test -n "$lj_ref"
          fetch() { git init -q "$3"; git -C "$3" remote add origin "$1"; git -C "$3" fetch -q --depth 1 origin "$2"; git -C "$3" checkout -q FETCH_HEAD; }
          fetch https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git "$pob_ref" .pob/PathOfBuilding-PoE2
          fetch https://github.com/LuaJIT/LuaJIT.git "$lj_ref" .pob/luajit-src
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build luajit.exe next to PoB's lua51.dll (MSVC, UCRT like PoB's DLLs)
        shell: cmd
        run: |
          cd .pob\luajit-src\src
          call msvcbuild.bat
          copy /Y luajit.exe ..\..\PathOfBuilding-PoE2\runtime\luajit.exe
      - run: pnpm build
      - run: pnpm --filter @astrolabe/mcp-bridge pack:mcpb
      - run: node apps/desktop/scripts/stage.mjs
      - name: Build installer and publish release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win --x64 --publish always
