# Data pipeline (F-01): extracts the game data of the pinned headless PoB into
# a raw snapshot (apps/data-pipeline) and runs the pipeline tests against the
# real PoB. On pull requests this is a smoke run; via workflow_dispatch it
# builds a named snapshot, optionally diffed against a previous PoB tag.
# The snapshot is uploaded as artifact; publishing releases comes later.
name: Data snapshot

on:
  pull_request:
    paths:
      - "apps/data-pipeline/**"
      - "config/data-pipeline/**"
      - "tools/setup_pob.sh"
      - ".github/workflows/data-snapshot.yml"
  workflow_dispatch:
    inputs:
      game-version:
        description: "Game version of this snapshot, e.g. 0.5 or 1.0.0.3"
        required: true
      revision:
        description: "Pipeline revision for this game version (release id poe2-<game>+r<n>)"
        required: true
        default: "1"
      compare-pob-ref:
        description: "Optional older PoB-PoE2 tag to diff against (e.g. the previous release)"
        required: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GAME_VERSION: ${{ inputs.game-version || '0.0' }}
      REVISION: ${{ inputs.revision || '1' }}
      COMPARE_REF: ${{ inputs.compare-pob-ref }}
      # the integration test must not be skipped here
      REQUIRE_POB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Set up headless PoB
        run: tools/setup_pob.sh

      - name: Pipeline tests against the real PoB
        run: pnpm exec turbo run test --filter=@astrolabe/data-pipeline

      - name: Build snapshot
        run: |
          pnpm exec turbo run build --filter=@astrolabe/data-pipeline
          node apps/data-pipeline/dist/cli.js snapshot \
            --game-version "$GAME_VERSION" --revision "$REVISION" --out data-snapshots/current

      - name: Stat coverage of mods
        run: |
          set -o pipefail
          node apps/data-pipeline/dist/cli.js stat-coverage data-snapshots/current \
            --out data-snapshots/current/stat-coverage.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Game data (crafting tables from the update servers)
        run: |
          set -o pipefail
          node apps/data-pipeline/dist/cli.js gamedata \
            --out data-snapshots/current/game-data 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build catalog
        run: |
          set -o pipefail
          node apps/data-pipeline/dist/cli.js catalog data-snapshots/current \
            --out data-snapshots/current/catalog \
            --game-data data-snapshots/current/game-data 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe essence descriptions (log only)
        run: |
          set -o pipefail
          node -e '
            const fs = require("fs");
            const dir = "data-snapshots/current/game-data";
            const manifest = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8"));
            const read = (n) => JSON.parse(fs.readFileSync(dir + "/" + manifest.tables.find((x) => x.name === n).path, "utf8"));
            const bases = read("BaseItemTypes");
            const seen = new Map();
            for (const r of read("CurrencyItems")) {
              if (r.Action !== "use_essence") continue;
              const d = String(r.Description ?? "");
              const e = seen.get(d) ?? { n: 0, names: [] };
              e.n++; if (e.names.length < 3) e.names.push(bases[r.BaseItemType]?.Name);
              seen.set(d, e);
            }
            const strip = (x) => String(x ?? "");
            const cur = read("CurrencyItems");
            for (const t of read("TieredCurrency")) {
              const c = cur.find((r) => r.BaseItemType === t.BaseItemType);
              console.log("TIER " + JSON.stringify({ name: bases[t.BaseItemType]?.Name, Tier: t.Tier, Min: t.MinimumModLevel, Lower: t.LowerTierBaseItemType, Action: c?.Action, desc: strip(c?.Description) }));
            }
            for (const [d, e] of seen) console.log("ESSDESC x" + e.n + " " + JSON.stringify(e.names) + " " + JSON.stringify(d));
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: List currency-like base items (id | name | tags)
        run: |
          set -o pipefail
          node -e '
            const fs = require("fs");
            const shard = JSON.parse(fs.readFileSync("data-snapshots/current/catalog/baseItem.json", "utf8"));
            const rows = shard.entities.filter((b) => b.id.startsWith("Metadata/"));
            console.log("currency-like base items: " + rows.length);
            for (const b of rows) console.log(["ITEM", b.id, b.name, b.itemClass, b.tags.join(",")].join(" | "));
            const actions = JSON.parse(fs.readFileSync("data-snapshots/current/catalog/craftingAction.json", "utf8")).entities;
            console.log("crafting actions: " + actions.length);
          ' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diff against an older PoB release
        if: env.COMPARE_REF != ''
        run: |
          POB_REF="$COMPARE_REF" bash -c '
            set -euo pipefail
            mkdir -p .pob-old
            git init --quiet .pob-old/PathOfBuilding-PoE2
            git -C .pob-old/PathOfBuilding-PoE2 remote add origin https://github.com/PathOfBuildingCommunity/PathOfBuilding-PoE2.git
            git -C .pob-old/PathOfBuilding-PoE2 fetch --quiet --depth 1 origin "refs/tags/$POB_REF"
            git -C .pob-old/PathOfBuilding-PoE2 checkout --quiet --force FETCH_HEAD
            cp .pob/luajit .pob-old/ && cp -r .pob/lib .pob-old/
          '
          node apps/data-pipeline/dist/cli.js snapshot \
            --game-version 0.0 --revision 1 --pob-home .pob-old --out data-snapshots/previous
          node apps/data-pipeline/dist/cli.js diff data-snapshots/previous data-snapshots/current
          cat data-snapshots/current/diff.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: data-snapshot
          path: data-snapshots/current/
          retention-days: 30
