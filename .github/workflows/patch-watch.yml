# Patch watcher (F-01, Day-0 readiness): once an hour, compare the game patch the update
# server announces with the published data releases, and the latest PoB-PoE2 release with the
# pinned one. When something is new, one issue labelled "patch-watch" tells what to do next
# (check the PoB release, bump the pin, run the "Data release" workflow); when it is resolved the
# issue is closed. The watcher only reports: bumping the pin and publishing a release stay human
# decisions (data releases are immutable, and a PoB bump needs the golden builds compared).
# A failing check shows as a red run; GitHub switches scheduled workflows off after 60 days
# without repository activity, so a silent watcher means: look at the Actions tab.
# Two jobs: the first runs third-party install scripts with read access only; the second has
# write access to issues and runs nothing but the GitHub CLI.
name: Patch watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.watch.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@astrolabe/data-pipeline

      - name: Compare patch and PoB release
        id: watch
        env:
          # read-only token of this job; only this step sees it
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node apps/data-pipeline/dist/cli.js patch-watch --repo "$GITHUB_REPOSITORY" --out report.md
          code=$?
          set -e
          # 0: nothing to do, 3: something to do; anything else is a failure of the watcher itself
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            echo "patch-watch failed with exit code $code" >&2
            exit "$code"
          fi
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: patch-watch-report
          path: report.md
          retention-days: 1

  issue:
    needs: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CODE: ${{ needs.watch.outputs.code }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: patch-watch-report
      - name: Open, update or close the watch issue
        run: |
          set -euo pipefail
          gh label create patch-watch --repo "$GITHUB_REPOSITORY" --force --color 5319e7 --description "Patch watcher: new game patch or PoB release" >/dev/null
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label patch-watch --state open --json number --jq '.[0].number // empty')
          if [ "$CODE" = "3" ]; then
            if [ -z "$number" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --label patch-watch --title "New game patch or PoB release to handle" --body-file report.md
            else
              current=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
              if [ "$current" != "$(cat report.md)" ]; then gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md; fi
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Resolved: $(head -n1 report.md)"
          fi
